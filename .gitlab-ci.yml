stages:
  - test
  - pages

run_tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest discover -s tests -v
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: pages
  image: alpine:3.19
  script:
    - mkdir -p public
    - cp -r site/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
